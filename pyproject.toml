[project]
name = "cdn-logs"
version = "1.0.0"
description = "Synthetic CDN access-log source for the Airflow + dbt + Snowflake ELT pipeline"
requires-python = ">=3.11"
dependencies = ["pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "sqlfluff>=4", "dbt-core>=1.10", "dbt-duckdb>=1.10", "duckdb>=1.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "dags"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "dags", "tests", "scripts", "streamlit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "AIR"]
