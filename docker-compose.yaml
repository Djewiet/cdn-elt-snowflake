# Airflow 3 — LocalExecutor stack for local development.
#   make up        -> build image, init metadata DB, start services
#   http://localhost:8080   (local dev: every user is admin, no login)
x-airflow-common: &airflow-common
  build: .
  image: cdn-elt-airflow:latest
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-only}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    # Connections as env vars (never stored in the repo).
    AIRFLOW_CONN_AWS_CDN: >-
      {"conn_type": "aws", "login": "${AWS_ACCESS_KEY_ID}", "password": "${AWS_SECRET_ACCESS_KEY}",
       "extra": {"region_name": "${AWS_REGION:-eu-west-3}"}}
    AIRFLOW_CONN_SNOWFLAKE_CDN: >-
      {"conn_type": "snowflake", "login": "${SNOWFLAKE_LOADER_USER:-SVC_CDN_LOADER}",
       "extra": {"account": "${SNOWFLAKE_ACCOUNT}", "warehouse": "CDN_WH", "database": "RAW",
                 "schema": "CDN", "role": "CDN_LOADER",
                 "private_key_file": "/opt/airflow/secrets/loader_rsa_key.p8"}}

    # dbt (prod target) — runs as the transformer service user.
    SNOWFLAKE_USER: ${SNOWFLAKE_TRANSFORMER_USER:-SVC_CDN_TRANSFORMER}
    SNOWFLAKE_PRIVATE_KEY_PATH: /opt/airflow/secrets/transformer_rsa_key.p8
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_LOG_PATH: /tmp/dbt-logs
    DBT_TARGET_PATH: /tmp/dbt-target
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./secrets:/opt/airflow/secrets:ro
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # Keep the image's entrypoint: it registers the host UID as a user.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        airflow pools set dbt 1 "Serialize dbt runs (incremental models share target tables)"
        cd /opt/airflow/dbt && /opt/dbt-venv/bin/dbt deps
        echo "Airflow initialised."
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
