version: 2

models:
  # ------------------------------------------------------------------ dims
  - name: dim_edge_pop
    description: Edge points of presence (conformed dimension).
    columns:
      - name: pop_key
        description: Surrogate key (hash of pop_code).
        data_tests: [unique, not_null]
      - name: pop_code
        description: Natural key.
        data_tests: [unique, not_null]

  - name: dim_http_status
    description: HTTP status codes with class and error flags.
    columns:
      - name: http_status
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension, one row per day.
    columns:
      - name: date_key
        description: Integer key YYYYMMDD.
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]

  # ----------------------------------------------------------------- facts
  - name: fct_cdn_requests
    description: >
      Transaction fact, 1 row per HTTP request. Incremental (delete+insert on
      request_id), rebuilt per Airflow data interval.
    config:
      tags: ["hourly"]
    columns:
      - name: request_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: pop_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_edge_pop')
                field: pop_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: http_status
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_http_status')
                field: http_status
      - name: request_hour
        data_tests: [not_null]
      - name: bytes_sent
        description: Response size in bytes.
      - name: response_time_ms
        description: Time to last byte at the edge, in milliseconds.

  - name: fct_cdn_hourly_metrics
    description: >
      Periodic snapshot fact. Grain: hour x edge POP x content category.
      Additive counts plus pre-computed ratios and latency percentiles.
    config:
      tags: ["hourly"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [request_hour, pop_code, content_category]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cache_hit_count <= cacheable_request_count and cacheable_request_count <= request_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "p50_response_time_ms <= p95_response_time_ms and p95_response_time_ms <= p99_response_time_ms"
    columns:
      - name: hourly_metric_key
        data_tests: [unique, not_null]
      - name: pop_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_edge_pop')
                field: pop_key
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: cache_hit_ratio
        description: Cache hits / cacheable requests (BYPASS excluded).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: byte_offload_ratio
        description: Share of egress bytes served from cache.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: error_rate
        description: (4xx + 5xx) / requests.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}

  # ------------------------------------------------------------- reporting
  - name: rpt_pop_daily_health
    description: Daily health scorecard per POP with an SLO flag (5xx < 1% every hour, p95 < 500 ms).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, pop_code]
    columns:
      - name: is_slo_met
        data_tests: [not_null]

exposures:
  - name: cdn_operations_dashboard
    label: CDN Operations Dashboard
    type: dashboard
    maturity: medium
    description: Hourly offload, error-rate and latency monitoring per edge POP.
    depends_on:
      - ref('fct_cdn_hourly_metrics')
      - ref('rpt_pop_daily_health')
    owner:
      name: Data Engineering
